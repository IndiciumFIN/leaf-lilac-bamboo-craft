name: Squawk SQL migrations (no deploy)
on:
  push:
    branches: [main]
    paths:
      - "migrations/*.sql"
      - ".squawk.toml"
      - "scripts/squawk-gate.mjs"
      - "scripts/lib/squawk-gate.mjs"
      - "scripts/squawk-baseline.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/squawk.yml"
  pull_request:
    branches: [main]
    paths:
      - "migrations/*.sql"
      - ".squawk.toml"
      - "scripts/squawk-gate.mjs"
      - "scripts/lib/squawk-gate.mjs"
      - "scripts/squawk-baseline.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/squawk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  squawk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ""
      PGHOST: ""
      CI: "true"
    steps:
      - name: Checkout with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Squawk gate
        run: npm run lint:sql
      - name: Squawk unit
        run: node --test scripts/squawk-gate.test.mjs
