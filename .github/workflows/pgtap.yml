name: pgTAP on PGlite (no deploy)
on:
  push:
    branches: [main]
    paths:
      - "migrations/*.sql"
      - "pgtap/**"
      - "scripts/pgtap-run.mjs"
      - "scripts/generate-fk-pgtap.mjs"
      - "scripts/lib/pgtap-result.mjs"
      - "scripts/lib/migrated-pglite.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pgtap.yml"
  pull_request:
    branches: [main]
    paths:
      - "migrations/*.sql"
      - "pgtap/**"
      - "scripts/pgtap-run.mjs"
      - "scripts/generate-fk-pgtap.mjs"
      - "scripts/lib/pgtap-result.mjs"
      - "scripts/lib/migrated-pglite.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pgtap.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ""
      PGHOST: ""
      CI: "true"
    steps:
      - name: Checkout with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: pgTAP
        run: npm run test:pgtap
      - name: pgTAP result unit
        run: node --test scripts/pgtap-result.test.mjs
